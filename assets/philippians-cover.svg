<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">Philippians devotional artwork</title>
  <desc id="desc">A dark purple and gold book cover with a road, letter, and Greek title motif.</desc>
  <defs>
    <radialGradient id="bg" cx="48%" cy="18%" r="90%">
      <stop offset="0" stop-color="#563570"/>
      <stop offset=".48" stop-color="#24182d"/>
      <stop offset="1" stop-color="#120d16"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#9f7034"/>
      <stop offset=".45" stop-color="#f2d294"/>
      <stop offset="1" stop-color="#b47b36"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="900" height="900" fill="url(#bg)"/>
  <circle cx="450" cy="235" r="150" fill="#c59a59" opacity=".09" filter="url(#glow)"/>
  <path d="M105 755 C235 650 286 600 338 520 C402 422 470 370 608 292 C676 253 725 219 797 145" fill="none" stroke="url(#gold)" stroke-width="12" opacity=".72"/>
