  <text x="450" y="690" text-anchor="middle" fill="#d5bceb" font-family="Georgia, serif" font-size="35" letter-spacing="4">ΠΡΟΣ ΦΙΛΙΠΠΗΣΙΟΥΣ</text>
  <text x="450" y="742" text-anchor="middle" fill="#aa96b8" font-family="system-ui, sans-serif" font-size="23" letter-spacing="5">GREEK NEW TESTAMENT STUDY</text>
