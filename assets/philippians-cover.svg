  <path d="M222 220 H678 M222 258 H638 M222 296 H665 M222 334 H615" stroke="#d9c6e7" stroke-width="4" opacity=".16" stroke-linecap="round"/>
  <path d="M235 402 C330 355 420 449 515 395 C575 360 635 372 675 401" fill="none" stroke="#d1ab69" stroke-width="5" opacity=".35"/>
